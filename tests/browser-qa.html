<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-Dwarf browser verification</title><style>body{background:#081823;color:#cde8eb;font:14px system-ui;margin:16px}button{padding:12px;margin:4px;background:#254550;color:white;border:1px solid #81bac4}iframe{display:block;border:2px solid #45636d;background:#07121b;margin-top:10px}pre{white-space:pre-wrap}</style><h1>K-Dwarf browser verification</h1><p>Developer fixtures use isolated K-Dwarf local storage. They replace the current test game's autosave.</p><nav><button id="recon">Recon fixture</button><button id="battle">Battle fixture</button><button id="camo">Camouflage fixture</button><button id="phone">Phone 390×844</button><button id="landscape">Landscape 844×390</button><button id="desktop">Desktop 1180×860</button><button id="report">Check layout</button></nav><pre id="result"></pre><iframe id="game" title="K-Dwarf test viewport" width="390" height="844"></iframe><script type="module">
import * as E from '../engine.js';import {armyTemplate} from '../army.js';import{save,load as loadSaved}from'../storage.js';
const f=document.querySelector('iframe'),out=document.querySelector('pre');function load(kind='recon'){const s=E.newGame({mode:'hotseat',autoRoll:false,seed:1204,armies:[armyTemplate('athenian','patrol'),armyTemplate('dominion','patrol')]});if(kind!=='recon'){s.phase='battle';s.deployment=false;s.active=0;s.initiative=1;s.recon.supremacy=0;s.terrain=[];s.options.battlefield.terrain=[];s.options.battlefield.objectives=[];s.events=[];s.objectives=[];s.units.forEach((u,i)=>{u.x=u.side?850:300;u.y=240+(i%4)*130;u.facing=u.side?180:0;});s.units[0].status='suppressed';if(kind==='camo'){s.units[4].specialOps=true;E.camouflage(s,s.units[4],{x:920,y:800},true);}s.morale.forEach(m=>m.fmr=500);}f.onload=()=>{f.onload=null;const stored=save(s);let check;try{check=loadSaved()?.phase;}catch(e){check=e.message;}f.src='../index.html?qa='+Date.now();out.textContent='Loaded '+kind+'; stored='+stored+'; validated='+check;};f.src='about:blank';}
for(const k of ['recon','battle','camo'])document.getElementById(k).onclick=()=>load(k);
for(const[k,w,h]of[['phone',390,844],['landscape',844,390],['desktop',1180,860]])document.getElementById(k).onclick=()=>{f.width=w;f.height=h;};
document.getElementById('report').onclick=()=>{const d=f.contentDocument,w=f.contentWindow,p=d.querySelector('.map-viewport'),r=p?.getBoundingClientRect();out.textContent=JSON.stringify({viewport:[w.innerWidth,w.innerHeight],documentWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>w.innerWidth,map:r&&{width:r.width,height:r.height},dialog:d.querySelector('dialog')?.open,dialogWidth:d.querySelector('dialog')?.getBoundingClientRect().width,dialogOverflow:d.querySelector('dialog')?.scrollWidth>d.querySelector('dialog')?.clientWidth,visibleButtons:[...d.querySelectorAll('button')].filter(b=>b.getBoundingClientRect().width>0).length,phase:d.querySelector('.eyebrow')?.textContent},null,2);};load();
</script>
